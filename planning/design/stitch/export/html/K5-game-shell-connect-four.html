<style>
    .tactile-emerald {
      background: radial-gradient(circle at 35% 30%, #4ae3a8 0%, #00a86b 55%, #00784c 100%);
      box-shadow: inset 0 2px 2px rgba(255, 255, 255, 0.65), 0 3px 0 #005a38, 0 4px 6px rgba(0, 0, 0, 0.25);
    }
    .tactile-gold {
      background: radial-gradient(circle at 35% 30%, #ffe57f 0%, #ffc800 60%, #c69b00 100%);
      box-shadow: inset 0 2px 2px rgba(255, 255, 255, 0.8), 0 3px 0 #9e7b00, 0 4px 6px rgba(0, 0, 0, 0.2);
    }
    .tactile-empty {
      background: #e2e3e1;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.16), inset 0 1px 1px rgba(0, 0, 0, 0.22);
    }
    .bubble-shadow {
      box-shadow: 0 3px 0 #000000;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface antialiased flex justify-center min-h-screen select-none font-body-md">
<div class="w-full max-w-[390px] min-h-[844px] flex flex-col justify-between px-4 pb-6 pt-2 bg-background border-x border-surface-container">
<!-- TOP APP BAR -->
<header class="flex justify-between items-center w-full h-14 border-b border-surface-container-highest">
<button class="flex items-center gap-1 px-3 py-1.5 rounded-full border border-outline-variant bg-surface-container-lowest text-primary font-label-md text-label-md tracking-wider active:scale-95 transition-transform duration-150 ease-out hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[15px]" data-icon="arrow_back">arrow_back</span>
<span>GAMES</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-primary tracking-wider uppercase">
        CONNECT FOUR
      </h1>
<div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full border border-outline-variant bg-surface-container-lowest font-label-sm text-label-sm tracking-wider uppercase text-on-surface">
<span>SARAH</span>
<span class="w-2 h-2 rounded-full bg-[#00a86b] animate-pulse"></span>
<span class="text-on-surface-variant font-medium">24MS</span>
</div>
</header>
<!-- MAIN GAME CANVAS STAGE -->
<main class="flex-1 flex flex-col justify-center gap-3 py-2">
<!-- STAGE CONTAINER CARD -->
<section class="w-full bg-surface-container-lowest border border-[#ECECE6] rounded-[28px] p-3.5 flex flex-col items-center">
<!-- TURN INFO & TIMERS -->
<div class="w-full flex justify-between items-center mb-3">
<div class="px-2.5 py-1 rounded-full bg-surface-container-low border border-surface-container-highest text-primary font-label-sm text-label-sm tracking-widest uppercase">
            TURN 14 · CONNECT 4 DISCS
          </div>
<div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container-low border border-surface-container-highest text-primary font-label-sm text-label-sm tracking-wider uppercase">
<span class="material-symbols-outlined text-[14px]" data-icon="timer">timer</span>
<span>0:24</span>
</div>
</div>
<!-- ACTIVE COLUMN 4 DROP INDICATOR -->
<div class="w-full grid grid-cols-7 gap-1.5 px-2 mb-1.5">
<div></div>
<div></div>
<div></div>
<!-- COL 4 TARGET ARROW & PREVIEW DISC -->
<div class="flex flex-col items-center animate-bounce">
<div class="w-6 h-6 rounded-full tactile-emerald flex items-center justify-center opacity-90 ring-2 ring-primary ring-offset-1">
<span class="material-symbols-outlined text-white text-[12px] font-bold" data-icon="arrow_downward">arrow_downward</span>
</div>
</div>
<div></div>
<div></div>
<div></div>
</div>
<!-- 7 COLUMNS X 6 ROWS CONNECT FOUR BOARD -->
<div class="w-full bg-surface-container-low border border-surface-container-highest rounded-2xl p-2.5">
<div class="grid grid-cols-7 gap-1.5 w-full">
<!-- ROW 1 (TOP) -->
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-empty ring-1 ring-primary/30"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<!-- ROW 2 -->
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-gold"></div>
<div class="aspect-square rounded-full tactile-empty ring-1 ring-primary/30"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<!-- ROW 3 -->
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-gold"></div>
<div class="aspect-square rounded-full tactile-emerald"></div>
<div class="aspect-square rounded-full tactile-empty ring-1 ring-primary/30"></div>
<div class="aspect-square rounded-full tactile-gold"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<!-- ROW 4 -->
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-emerald"></div>
<div class="aspect-square rounded-full tactile-gold"></div>
<div class="aspect-square rounded-full tactile-gold ring-1 ring-primary/30"></div>
<div class="aspect-square rounded-full tactile-emerald"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<!-- ROW 5 -->
<div class="aspect-square rounded-full tactile-emerald"></div>
<div class="aspect-square rounded-full tactile-gold"></div>
<div class="aspect-square rounded-full tactile-emerald"></div>
<div class="aspect-square rounded-full tactile-emerald ring-1 ring-primary/30"></div>
<div class="aspect-square rounded-full tactile-gold"></div>
<div class="aspect-square rounded-full tactile-gold"></div>
<div class="aspect-square rounded-full tactile-empty"></div>
<!-- ROW 6 (BASE) -->
<div class="aspect-square rounded-full tactile-emerald"></div>
<div class="aspect-square rounded-full tactile-gold"></div>
<div class="aspect-square rounded-full tactile-emerald"></div>
<div class="aspect-square rounded-full tactile-emerald ring-1 ring-primary/30"></div>
<div class="aspect-square rounded-full tactile-gold"></div>
<div class="aspect-square rounded-full tactile-emerald"></div>
<div class="aspect-square rounded-full tactile-gold"></div>
</div>
</div>
<!-- SCORE SUB-STRIP -->
<div class="w-full mt-3 pt-2.5 border-t border-surface-container-high flex justify-between items-center px-1 font-label-sm text-label-sm tracking-wider uppercase text-on-surface">
<div class="flex items-center gap-1.5">
<span class="w-2.5 h-2.5 rounded-full tactile-emerald"></span>
<span>DANIEL: 2 WINS</span>
</div>
<span class="text-outline-variant">·</span>
<div class="flex items-center gap-1.5">
<span class="w-2.5 h-2.5 rounded-full tactile-gold"></span>
<span>SARAH: 1 WIN</span>
</div>
</div>
</section>
<!-- PLAYFUL BANTER BUBBLE WITH UPWARD TAIL -->
<div class="relative w-full flex flex-col items-center">
<!-- Direct tail pointing up to stage -->
<div class="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[6px] border-b-primary z-10 -mb-[1px]"></div>
<div class="w-full bg-[#D4FE00] border-[1.5px] border-primary rounded-2xl p-2.5 bubble-shadow flex items-start gap-2">
<span class="material-symbols-outlined text-primary text-[18px] mt-0.5" data-icon="forum">forum</span>
<div class="flex-1">
<p class="font-body-sm text-body-sm font-semibold text-primary leading-tight">
              Sarah: Watch out for Column 4! 😏
            </p>
<p class="font-body-sm text-xs text-on-secondary-fixed-variant mt-0.5">
              Drop your disc into column 4 to block Sarah's diagonal setup.
            </p>
</div>
</div>
</div>
</main>
<!-- BOTTOM THUMB ZONE (ERGONOMIC PRIMARY TRIGGER & UTILITIES) -->
<footer class="w-full flex flex-col gap-2 mt-auto">
<!-- DOMINANT PRIMARY CTA -->
<button class="w-full h-[52px] bg-primary text-on-primary rounded-full flex items-center justify-center gap-2 font-label-lg text-label-lg tracking-wider uppercase active:scale-[0.97] transition-transform duration-100 shadow-md">
<span>DROP DISC IN COL 4</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- SECONDARY UTILITY CAPSULES -->
<div class="grid grid-cols-2 gap-2">
<button class="h-10 bg-surface-container-lowest border border-surface-container-highest rounded-full flex items-center justify-center gap-1.5 text-primary font-label-md text-label-md tracking-wider uppercase active:scale-95 transition-transform duration-150 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[15px]" data-icon="handshake">handshake</span>
<span>OFFER DRAW</span>
</button>
<button class="h-10 bg-surface-container-lowest border border-surface-container-highest rounded-full flex items-center justify-center gap-1.5 text-primary font-label-md text-label-md tracking-wider uppercase active:scale-95 transition-transform duration-150 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[15px]" data-icon="settings">settings</span>
<span>GAME OPTIONS</span>
</button>
</div>
</footer>
</div>
</body></html>
